# @package _global_

# to execute this experiment run:
# python src/train.py experiment=mobilenetv2_cifar10

defaults:
  - override /data: cifar10
  - override /model: mobilenetv2
  - override /callbacks: default
  - override /trainer: gpu

tags: ["cifar10", "mobilenetv2", "baseline"]

seed: 42

trainer:
  min_epochs: 200
  max_epochs: 200
  precision: bf16-mixed

logger:
  wandb:
    tags: ${tags}
    group: "mobilenetv2-cifar10"
