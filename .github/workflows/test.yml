name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install lightning torchmetrics "hydra-core>=1.3" hydra-colorlog wandb rootutils rich pytest

      - name: Run tests
        env:
          WANDB_MODE: offline
        run: |
          export PROJECT_ROOT=$(pwd)
          pytest tests/test_configs.py tests/test_datamodules.py tests/test_quant.py -o addopts="" -q
